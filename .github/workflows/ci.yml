name: CI

# Manual only: builds and checks run locally (see AGENTS.md). Start this from the Actions tab
# when a hosted build is actually wanted (e.g. Windows or macOS installers). Choosing a system
# runs only that build, skipping the checks and the other builds to save minutes:
#   gh workflow run ci.yml --ref <branch> -f run=Windows
#   gh workflow run ci.yml --ref <branch> -f run="Windows and macOS"
# macOS runs only when asked for by name: it is the slowest build (two architectures). It builds the
# app signed ad hoc (no certificate, no secrets here); signing and notarisation happen elsewhere.
# The installers bundle the speech model (~575 MB, tools/fetch-speech-models.mjs, cached here).
on:
  workflow_dispatch:
    inputs:
      run:
        description: What to run
        type: choice
        options: [everything, Windows, Linux, macOS, Windows and macOS]
        default: everything

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests, lint
    if: inputs.run == 'everything'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf libasound2-dev libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:privacy --workspace @trama/app
      - name: Build the web UI (the Rust crate embeds it)
        run: npm run build --workspace @trama/app
      - run: npm run lint:rust
      - run: npm run test:rust

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    # Runs after the checks pass, or on its own when the checks were not asked for.
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.run == 'everything' && '["Linux","Windows"]' || inputs.run == 'Windows and macOS' && '["Windows","macOS"]' || format('["{0}"]', inputs.run)) }}
    runs-on: ${{ matrix.name == 'Windows' && 'windows-latest' || matrix.name == 'macOS' && 'macos-latest' || 'ubuntu-22.04' }}
    # The speech engine is compiled twice on macOS (Apple silicon and Intel).
    timeout-minutes: ${{ matrix.name == 'macOS' && 75 || 90 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf libasound2-dev libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          # One universal app for Apple silicon and Intel Macs.
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Speech model files (cached; checked against their SHA-256)
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/speech
          key: speech-models-${{ hashFiles('tools/fetch-speech-models.mjs') }}
      - run: node tools/fetch-speech-models.mjs
      - name: Build installers (unsigned)
        if: runner.os != 'macOS'
        run: npm run tauri --workspace @trama/desktop -- build --config src-tauri/tauri.speech.conf.json --bundles ${{ matrix.name == 'Windows' && 'nsis,msi' || 'appimage,deb,rpm' }}
      - name: Build the Mac app (signed ad hoc)
        if: runner.os == 'macOS'
        env:
          # "-" signs ad hoc: the app runs after "Open" in System Settings, but is not notarised.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm run tauri --workspace @trama/desktop -- build --config src-tauri/tauri.speech.conf.json --target universal-apple-darwin --bundles app
          cd desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
          version=$(node -p "require('$GITHUB_WORKSPACE/desktop/src-tauri/tauri.conf.json').version")
          tar -czf "Trama_${version}_universal-adhoc.app.tar.gz" Trama.app
      - name: Check the Mac app
        if: runner.os == 'macOS'
        # Reports only: the app is uploaded either way.
        continue-on-error: true
        run: |
          app=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Trama.app
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app"/Contents/MacOS/*; do echo "$(basename "$bin"): $(lipo -archs "$bin")"; done
      - uses: actions/upload-artifact@v7
        with:
          name: trama-${{ matrix.name }}-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
