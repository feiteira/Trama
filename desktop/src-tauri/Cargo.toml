[package]
name = "trama-desktop"
version = "0.1.0"
description = "Trama — free, offline, encrypted qualitative data analysis (desktop shell)"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "trama_desktop_lib"
# staticlib and cdylib are what `tauri android/ios` link against; keep them for the mobile builds.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# The only plugin: native open/save dialogs. Trama makes no network connections, so there is
# deliberately no http or opener plugin.
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
walkdir = "2.5"
hex = "0.4"
zeroize = "1"
thiserror = "2"
percent-encoding = "2"
# On-device speech, desktop only: whisper.cpp (compiled from source by whisper-rs-sys; see
# .cargo/config.toml at the repository root), decoding of the recordings people import, and
# recording a call from the microphone and from what the computer plays.
whisper-rs = "0.16"
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "opt-simd"] }
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
# PulseAudio's native protocol, in Rust (PipeWire serves it too): the Linux backend that can
# record what the speakers play, from the output's monitor source.
cpal = { version = "0.18", features = ["pulseaudio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
