[package]
name = "trama-desktop"
version = "0.1.0"
description = "Trama — free, offline, encrypted qualitative data analysis (desktop shell)"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "trama_desktop_lib"
# staticlib and cdylib are what `tauri android/ios` link against; keep them for the mobile builds.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# The only plugin: native open/save dialogs. Trama makes no network connections, so there is
# deliberately no http or opener plugin.
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
walkdir = "2.5"
hex = "0.4"
zeroize = "1"
thiserror = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
