name: Translation or manual
description: A wrong, unclear or unnatural word in the interface or the manual
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        Trama is in English, European Portuguese and European Spanish. Tell us where a word or sentence is wrong, unclear or sounds unnatural.
        Pode escrever em português · Puede escribir en español.
  - type: dropdown
    attributes:
      label: Language
      options: [English, Português (Portugal), Español (España)]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Where, what it says now, and what it should say
      placeholder: "Codebook → Merge into…: “…” should be “…”"
    validations:
      required: true
