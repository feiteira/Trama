[package]
name = "sala-desktop"
version = "0.2.1"
description = "Sala — the offline-first practice app for therapists (desktop shell)"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sala_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-http = "~2.7"
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
walkdir = "2.5"
hex = "0.4"
zeroize = "1"
thiserror = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
